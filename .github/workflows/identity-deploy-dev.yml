name: Identity Deploy - DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.303'
  BUILD_CONFIGURATION: 'Release'

  SOLUTION_FILE: 'TexasMediaDart.Identity.slnx'

  API_PROJECT: 'src/TexasMediaDart.Identity.Api/TexasMediaDart.Identity.Api.csproj'
  API_PUBLISH_PATH: '${{ github.workspace }}/publish'

  DATABASE_PROJECT: 'database/TexasMediaDart.Identity.Database/TexasMediaDart.Identity.Database.sqlproj'
  DACPAC_PATH: 'database/TexasMediaDart.Identity.Database/bin/Release/TexasMediaDart.Identity.Database.dacpac'

  AZURE_WEBAPP_NAME: 'texasmediadart-identity-api-dev'

jobs:

  build:
    name: Build Identity Release
    runs-on: windows-latest

    outputs:
      build_version: ${{ steps.version.outputs.version }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate build version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $build = "{0:D4}" -f [int]$env:GITHUB_RUN_NUMBER
          $version = "$date.$build"

          "BUILD_VERSION=$version" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Identity Release Version: $version"

          "### Identity Release Version" >> $env:GITHUB_STEP_SUMMARY
          "**$version**" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore solution
        run: >
          dotnet restore
          ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: >
          dotnet build
          ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Publish Identity API
        run: >
          dotnet publish
          ${{ env.API_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ${{ env.API_PUBLISH_PATH }}
          /p:InformationalVersion=${{ env.BUILD_VERSION }}
          /p:IncludeSourceRevisionInInformationalVersion=false

      - name: Create versioned API package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts" | Out-Null

          $zip =
            "artifacts/TexasMediaDart.Identity.Api-$env:BUILD_VERSION.zip"

          Compress-Archive `
            -Path "${{ env.API_PUBLISH_PATH }}\*" `
            -DestinationPath $zip `
            -Force

          Write-Host "API package created:"
          Write-Host $zip

      - name: Build SQL Project for Azure SQL
        run: >
          dotnet build
          ${{ env.DATABASE_PROJECT }}
          --configuration Release
          --no-restore
          /p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider

      - name: Verify DACPAC
        shell: pwsh
        run: |
          $dacpac = "${{ env.DACPAC_PATH }}"

          if (-not (Test-Path $dacpac)) {
              Write-Error "Identity DACPAC was not generated."
              exit 1
          }

          Write-Host "Identity DACPAC generated:"
          Write-Host $dacpac

      - name: Create versioned DACPAC
        shell: pwsh
        run: |
          $source = "${{ env.DACPAC_PATH }}"

          $destination =
            "artifacts/TexasMediaDart.Identity.Database-$env:BUILD_VERSION.dacpac"

          Copy-Item `
            -Path $source `
            -Destination $destination

          Write-Host "DACPAC package created:"
          Write-Host $destination

      - name: Upload Identity API artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Identity.Api-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Identity.Api-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Identity Database artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Identity.Database-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Identity.Database-${{ env.BUILD_VERSION }}.dacpac
          if-no-files-found: error
          retention-days: 30


  deploy-database-dev:
    name: Deploy Identity Database to DEV
    needs: build
    runs-on: windows-latest

    environment:
      name: DEV

    steps:

      - name: Display version
        shell: pwsh
        run: |
          Write-Host "Deploying Identity Database Version:"
          Write-Host "${{ needs.build.outputs.build_version }}"

      - name: Download Identity Database artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Identity.Database-${{ needs.build.outputs.build_version }}
          path: dacpac

      - name: Deploy DACPAC to DEV
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.IDENTITY_DEV_SQL_CONNECTION_STRING }}
          path: dacpac/TexasMediaDart.Identity.Database-${{ needs.build.outputs.build_version }}.dacpac
          action: publish


  deploy-api-dev:
    name: Deploy Identity API to DEV
    needs:
      - build
      - deploy-database-dev

    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:

      - name: Display version
        run: |
          echo "Deploying Identity API Version:"
          echo "${{ needs.build.outputs.build_version }}"

      - name: Download Identity API artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Identity.Api-${{ needs.build.outputs.build_version }}
          path: artifacts

      - name: Verify API package
        shell: bash
        run: |
          PACKAGE="artifacts/TexasMediaDart.Identity.Api-${{ needs.build.outputs.build_version }}.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "Identity API package was not found:"
            echo "$PACKAGE"
            exit 1
          fi

          echo "Identity API package:"
          echo "$PACKAGE"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Identity API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: artifacts/TexasMediaDart.Identity.Api-${{ needs.build.outputs.build_version }}.zip