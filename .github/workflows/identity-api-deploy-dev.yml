name: Identity API Deploy - DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.303'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_FILE: 'TexasMediaDart.Identity.slnx'
  API_PROJECT: 'src/TexasMediaDart.Identity.Api/TexasMediaDart.Identity.Api.csproj'
  API_PUBLISH_PATH: '${{ github.workspace }}/publish'
  AZURE_WEBAPP_NAME: 'texasmediadart-identity-api-dev'
  AZURE_RESOURCE_GROUP: 'TexasMediaDart-Dev'

jobs:

  # ============================================================
  # Build
  # ============================================================

  build:
    name: Build Identity API Release
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.version }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # .NET
      # --------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --------------------------------------------------------
      # Version
      # Format: yyyy.MM.dd.####
      # --------------------------------------------------------

      - name: Generate build version
        id: version
        shell: bash
        run: |
          DATE=$(date +'%Y.%m.%d')
          BUILD=$(printf "%04d" "${{ github.run_number }}")
          VERSION="$DATE.$BUILD"

          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Identity API Release Version: $VERSION"

          echo "### Identity API Release Version" >> "$GITHUB_STEP_SUMMARY"
          echo "**$VERSION**" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------
      # Restore
      # --------------------------------------------------------

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build solution
        run: >
          dotnet build
          ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      # --------------------------------------------------------
      # Publish
      # --------------------------------------------------------

      - name: Publish Identity API
        run: >
          dotnet publish
          ${{ env.API_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ${{ env.API_PUBLISH_PATH }}
          /p:InformationalVersion=${{ env.BUILD_VERSION }}
          /p:IncludeSourceRevisionInInformationalVersion=false

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Create versioned API package
        shell: bash
        run: |
          mkdir -p artifacts

          PACKAGE="artifacts/TexasMediaDart.Identity.Api-${BUILD_VERSION}.zip"

          cd "${{ env.API_PUBLISH_PATH }}"
          zip -r "${{ github.workspace }}/$PACKAGE" .

          echo "Identity API package created:"
          echo "$PACKAGE"

      # --------------------------------------------------------
      # Upload artifact
      # --------------------------------------------------------

      - name: Upload Identity API artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Identity.Api-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Identity.Api-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Deploy DEV
  # ============================================================

  deploy-api-dev:
    name: Deploy Identity API to DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      # --------------------------------------------------------
      # Version
      # --------------------------------------------------------

      - name: Display version
        run: |
          echo "Deploying Identity API Version:"
          echo "${{ needs.build.outputs.build_version }}"

      # --------------------------------------------------------
      # Download artifact
      # --------------------------------------------------------

      - name: Download Identity API artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Identity.Api-${{ needs.build.outputs.build_version }}
          path: artifacts

      # --------------------------------------------------------
      # Verify package
      # --------------------------------------------------------

      - name: Verify API package
        shell: bash
        run: |
          PACKAGE="artifacts/TexasMediaDart.Identity.Api-${{ needs.build.outputs.build_version }}.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: Identity API package was not found:"
            echo "$PACKAGE"
            exit 1
          fi

          echo "Identity API package:"
          echo "$PACKAGE"

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Validate GitHub DEV configuration
      # --------------------------------------------------------

      - name: Validate DEV configuration
        shell: bash
        env:
          IDENTITY_SERVICE_API_KEY: ${{ secrets.IDENTITY_SERVICE_API_KEY }}
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          NOTIFICATION_SERVICE_BASE_URL: ${{ vars.NOTIFICATION_SERVICE_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        run: |
          if [ -z "$IDENTITY_SERVICE_API_KEY" ]; then
            echo "ERROR: IDENTITY_SERVICE_API_KEY is missing or empty."
            exit 1
          fi

          if [ -z "$NOTIFICATION_SERVICE_API_KEY" ]; then
            echo "ERROR: NOTIFICATION_SERVICE_API_KEY is missing or empty."
            exit 1
          fi

          if [ -z "$NOTIFICATION_SERVICE_BASE_URL" ]; then
            echo "ERROR: NOTIFICATION_SERVICE_BASE_URL is missing or empty."
            exit 1
          fi

          if [ -z "$FRONTEND_BASE_URL" ]; then
            echo "ERROR: FRONTEND_BASE_URL is missing or empty."
            exit 1
          fi

          echo "Identity DEV configuration is available."

      # --------------------------------------------------------
      # Configure Azure App Service
      # --------------------------------------------------------

      - name: Configure DEV application settings
        shell: bash
        env:
          IDENTITY_SERVICE_API_KEY: ${{ secrets.IDENTITY_SERVICE_API_KEY }}
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          NOTIFICATION_SERVICE_BASE_URL: ${{ vars.NOTIFICATION_SERVICE_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        run: |
          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              "Cors__AllowedOrigins__0=$FRONTEND_BASE_URL" \
              "ServiceAuthentication__ApiKey=$IDENTITY_SERVICE_API_KEY" \
              "NotificationService__BaseUrl=$NOTIFICATION_SERVICE_BASE_URL" \
              "NotificationService__ApiKey=$NOTIFICATION_SERVICE_API_KEY" \
              "Email__FrontendBaseUrl=$FRONTEND_BASE_URL"

      # --------------------------------------------------------
      # Verify Azure App Service settings
      # --------------------------------------------------------

      - name: Verify DEV application settings
        shell: bash
        run: |
          REQUIRED_SETTINGS=(
            "Cors__AllowedOrigins__0"
            "ServiceAuthentication__ApiKey"
            "NotificationService__BaseUrl"
            "NotificationService__ApiKey"
            "Email__FrontendBaseUrl"
          )

          for SETTING in "${REQUIRED_SETTINGS[@]}"; do

            SETTING_EXISTS=$(az webapp config appsettings list \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='$SETTING'].name | [0]" \
              --output tsv)

            if [ "$SETTING_EXISTS" != "$SETTING" ]; then
              echo "ERROR: $SETTING was not created in Azure App Service."
              exit 1
            fi

            echo "$SETTING exists."
          done

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy Identity API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: artifacts/TexasMediaDart.Identity.Api-${{ needs.build.outputs.build_version }}.zip

      # --------------------------------------------------------
      # Get actual Azure hostname
      #
      # Secure unique default hostname may be enabled.
      # Therefore, do not assume:
      #
      # <app-name>.azurewebsites.net
      #
      # Retrieve the actual defaultHostName from Azure.
      # --------------------------------------------------------

      - name: Get Identity API hostname
        id: hostname
        shell: bash
        run: |
          DEFAULT_HOSTNAME=$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "defaultHostName" \
            --output tsv)

          if [ -z "$DEFAULT_HOSTNAME" ]; then
            echo "ERROR: Unable to determine Identity API hostname."
            exit 1
          fi

          echo "Identity API hostname:"
          echo "$DEFAULT_HOSTNAME"

          echo "hostname=$DEFAULT_HOSTNAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Health check
      # --------------------------------------------------------

      - name: Verify Identity API health
        shell: bash
        env:
          DEFAULT_HOSTNAME: ${{ steps.hostname.outputs.hostname }}
        run: |
          HEALTH_URL="https://${DEFAULT_HOSTNAME}/health/api"

          echo "Checking Identity API health:"
          echo "$HEALTH_URL"

          for attempt in {1..12}; do

            echo "Health check attempt $attempt of 12..."

            if RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              "$HEALTH_URL"); then

              echo ""
              echo "Identity API health response:"
              echo "$RESPONSE"
              echo ""
              echo "Identity API is healthy."

              echo "### Identity API DEV Deployment" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Version:** ${{ needs.build.outputs.build_version }}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Host:** $DEFAULT_HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Health:** Healthy" >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            echo ""
            echo "Health check attempt $attempt failed."

            if [ "$attempt" -lt 12 ]; then
              echo "Waiting 10 seconds..."
              sleep 10
            fi

          done

          echo ""
          echo "ERROR: Identity API health check failed after 12 attempts."
          echo "URL: $HEALTH_URL"

          exit 1