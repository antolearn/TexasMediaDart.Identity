name: Identity Deploy - PROD

on:
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: 'Successful Identity Deploy - DEV run ID to promote'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: 'texasmediadart-identity-api-prod'

jobs:

  # =========================================================
  # DOWNLOAD AND VALIDATE EXACT DEV ARTIFACTS
  # =========================================================
  prepare:
    name: Prepare DEV Artifacts for PROD
    runs-on: ubuntu-latest

    environment:
      name: prod

    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      api_zip_name: ${{ steps.files.outputs.api_zip_name }}
      dacpac_name: ${{ steps.files.outputs.dacpac_name }}

    steps:
      - name: Download artifacts from DEV run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.dev_run_id }}
          pattern: '*'
          merge-multiple: true
          path: promoted-artifacts

      - name: Display downloaded artifacts
        shell: bash
        run: |
          echo "Artifacts downloaded from DEV run:"
          find promoted-artifacts -maxdepth 2 -type f -print

      - name: Validate promoted artifacts
        id: files
        shell: bash
        run: |
          set -euo pipefail

          API_ZIP=$(find promoted-artifacts \
            -type f \
            -name 'TexasMediaDart.Identity.Api-*.zip' \
            | head -n 1)

          DACPAC=$(find promoted-artifacts \
            -type f \
            -name 'TexasMediaDart.Identity.Database-*.dacpac' \
            | head -n 1)

          if [ -z "$API_ZIP" ]; then
            echo "ERROR: Identity API ZIP was not found."
            exit 1
          fi

          if [ -z "$DACPAC" ]; then
            echo "ERROR: Identity database DACPAC was not found."
            exit 1
          fi

          API_ZIP_NAME=$(basename "$API_ZIP")
          DACPAC_NAME=$(basename "$DACPAC")

          echo "API ZIP:"
          echo "$API_ZIP"

          echo "DACPAC:"
          echo "$DACPAC"

          echo "api_zip_name=$API_ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "dacpac_name=$DACPAC_NAME" >> "$GITHUB_OUTPUT"

      - name: Determine and validate build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          API_FILE="${{ steps.files.outputs.api_zip_name }}"
          DB_FILE="${{ steps.files.outputs.dacpac_name }}"

          API_VERSION="${API_FILE#TexasMediaDart.Identity.Api-}"
          API_VERSION="${API_VERSION%.zip}"

          DB_VERSION="${DB_FILE#TexasMediaDart.Identity.Database-}"
          DB_VERSION="${DB_VERSION%.dacpac}"

          echo "API version:      $API_VERSION"
          echo "Database version: $DB_VERSION"

          if [ "$API_VERSION" != "$DB_VERSION" ]; then
            echo "ERROR: API and database artifact versions do not match."
            exit 1
          fi

          if ! [[ "$API_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]]; then
            echo "ERROR: Invalid version format: $API_VERSION"
            exit 1
          fi

          echo "build_version=$API_VERSION" >> "$GITHUB_OUTPUT"

          echo "## Identity PROD Promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**DEV Run ID:** ${{ inputs.dev_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $API_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**API Artifact:** $API_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Database Artifact:** $DB_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated promotion artifacts
        uses: actions/upload-artifact@v4
        with:
          name: identity-prod-promotion-${{ steps.version.outputs.build_version }}
          path: promoted-artifacts
          retention-days: 30


  # =========================================================
  # DEPLOY DATABASE TO PROD
  # =========================================================
  deploy_database:
    name: Deploy Identity Database to PROD
    runs-on: ubuntu-latest
    needs: prepare

    environment:
      name: prod

    steps:
      - name: Download validated promotion artifacts
        uses: actions/download-artifact@v4
        with:
          name: identity-prod-promotion-${{ needs.prepare.outputs.build_version }}
          path: promoted-artifacts

      - name: Locate DACPAC
        id: dacpac
        shell: bash
        run: |
          set -euo pipefail

          DACPAC=$(find promoted-artifacts \
            -type f \
            -name 'TexasMediaDart.Identity.Database-*.dacpac' \
            | head -n 1)

          if [ -z "$DACPAC" ]; then
            echo "ERROR: DACPAC not found."
            exit 1
          fi

          echo "path=$DACPAC" >> "$GITHUB_OUTPUT"

          echo "Deploying:"
          echo "$DACPAC"

      - name: Deploy Identity database to PROD
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.IDENTITY_PROD_SQL_CONNECTION_STRING }}
          path: ${{ steps.dacpac.outputs.path }}
          action: publish


  # =========================================================
  # DEPLOY API TO PROD
  # Database must succeed before API promotion
  # =========================================================
  deploy_api:
    name: Deploy Identity API to PROD
    runs-on: ubuntu-latest

    needs:
      - prepare
      - deploy_database

    environment:
      name: prod

    steps:
      - name: Download validated promotion artifacts
        uses: actions/download-artifact@v4
        with:
          name: identity-prod-promotion-${{ needs.prepare.outputs.build_version }}
          path: promoted-artifacts

      - name: Locate API ZIP
        id: api
        shell: bash
        run: |
          set -euo pipefail

          API_ZIP=$(find promoted-artifacts \
            -type f \
            -name 'TexasMediaDart.Identity.Api-*.zip' \
            | head -n 1)

          if [ -z "$API_ZIP" ]; then
            echo "ERROR: API ZIP not found."
            exit 1
          fi

          echo "path=$API_ZIP" >> "$GITHUB_OUTPUT"

          echo "Deploying:"
          echo "$API_ZIP"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Identity API to PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ steps.api.outputs.path }}

      - name: Azure logout
        if: always()
        run: az logout

      - name: PROD deployment summary
        shell: bash
        run: |
          echo "## Identity PROD Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.prepare.outputs.build_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Promoted from DEV Run:** ${{ inputs.dev_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Database:** Successfully deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**API:** Successfully deployed" >> "$GITHUB_STEP_SUMMARY"